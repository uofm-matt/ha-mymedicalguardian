# The mutation gate's declared load-bearing set: the Fall/SOS firing path and the
# portal parsers. Read by ~/.claude/review/mutation.py. A survivor listed below is a
# claim with a reason attached; the runner also fails on a listed mutant that no longer
# survives, so a closed gap forces its entry out of this file.

[gate]
# api.py only. Every mutant of event.py reports "segfault": mutmut forks pytest
# in-process and the Home Assistant fixtures the event tests need do not survive the
# fork (measured 2026-10-10, 174 of 174). event.py's load-bearing lines are pinned by
# [[sentinel]] entries below instead, which run the suite normally.
scope = [
    "custom_components.mymedicalguardian.api.*",
]

[[sentinel]]
file = "custom_components/mymedicalguardian/api.py"
find = '_CRITICAL_ALERTS = {"Fall", "SOS"}'
replace = '_CRITICAL_ALERTS = {"Fall"}'
why = "SOS stops being critical; a newer routine event can then outrank it. Killed by test_sos_fires_before_newer_routine."

[[sentinel]]
file = "custom_components/mymedicalguardian/event.py"
find = "and (key := (a.type, a.observed_at)) not in self._fired"
replace = "and (key := (a.type, a.observed_at)) is not None"
why = "Drops the fired-set check, so every poll re-fires every in-window alert. Killed by test_does_not_refire_same_alert."

[[sentinel]]
file = "custom_components/mymedicalguardian/api.py"
find = "if m is None and ds.strip():"
replace = "if False:"
why = "Dashboard markup drift returns an alert-less snapshot again, with no FetchError, so Fall/SOS detection is silently off. Killed by test_drifted_device_status_raises_fetch_error."

[[sentinel]]
file = "custom_components/mymedicalguardian/api.py"
find = 'login.get("error", True)'
replace = 'login.get("error", False)'
why = "A 200 login body with no error key is accepted as success. Killed by test_login_200_without_error_key_is_rejected."

[[sentinel]]
file = "custom_components/mymedicalguardian/event.py"
find = "mark = min(alert.observed_at, utcnow())"
replace = "mark = alert.observed_at"
why = "A skewed future stamp persists as the restart baseline and swallows real alerts after a restart. Killed by test_persisted_mark_never_exceeds_now."

[[sentinel]]
file = "custom_components/mymedicalguardian/event.py"
find = "lookback if floor is None else max(lookback, min(floor, mark))"
replace = "lookback"
why = "The restart looks back past the floor, so an alert an earlier session or version already handled, or a pre-install one, replays as a new Fall. Killed by test_first_restart_does_not_fire_preinstall_fall and test_second_restart_after_upgrade_does_not_replay_fired_fall."

