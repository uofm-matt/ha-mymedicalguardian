version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # pytest-homeassistant-custom-component pins pytest, pytest-asyncio and
    # pytest-cov exactly, so they move only with it. It is held at the newest
    # release that still runs on Python 3.12; CI's latest job covers newer ones.
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: pytest-homeassistant-custom-component
        versions: [">0.13.205"]
